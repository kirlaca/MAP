# Napi GitHub Pages build: friss állampapír-kínálat + a minta-portfólió ajánló-riportja.
# A minta kitalált adat (minta/portfolio_minta.xls); személyes portfólió soha nem kerül ide.
name: Pages – napi kínálat

on:
  schedule:
    - cron: "15 5 * * *"     # naponta 05:15 UTC (07:15 nyári / 06:15 téli magyar idő)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Budapest
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # az újdonság-figyelés nyilvántartása (data/allampapir/ismert.json) futásról futásra megmarad
      - uses: actions/cache@v4
        with:
          path: data/allampapir/ismert.json
          key: ismert-${{ github.run_id }}
          restore-keys: ismert-
      - run: python scripts/pages_build.py --frissit
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
